name: CI/CD (Express on EC2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        working-directory: ./app/backend
        run: npm install

      - name: Run backend tests
        working-directory: ./app/backend
        run: npm test --if-present

      - name: Install frontend dependencies
        working-directory: ./app/frontend
        run: npm install

      - name: Build frontend bundle
        working-directory: ./app/frontend
        run: npm run build --if-present

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Sync repo to app dir
        run: rsync -az --delete --exclude ".git" ./ /opt/myapp/

      - name: Install deps & build on EC2
        run: |
          export NVM_DIR="/home/deploy/.nvm"; . "$NVM_DIR/nvm.sh"
          nvm use default

          cd /opt/myapp/app/backend
          npm install

          cd /opt/myapp/app/frontend
          npm install
          npm run build

      - name: Publish frontend assets
        run: |
          mkdir -p /opt/myapp/www
          rm -rf /opt/myapp/www/*
          cp -r /opt/myapp/app/frontend/dist/* /opt/myapp/www/

      # AWS prerequisites for the deploy user / instance:
      # - Nginx (or another static file server) should serve /opt/myapp/www as the frontend root.
      # - Security groups / ALB listeners should expose the Nginx port (e.g., 80/443) in addition to the API port.
      # - The deploy user must have pm2 startup configured (e.g., `pm2 startup systemd`) so the API restarts on reboot.

      - name: Prepare logs directory
        run: mkdir -p /opt/myapp/logs

      - name: Reload PM2 (zero-downtime)
        run: |
          export NVM_DIR="/home/deploy/.nvm"; . "$NVM_DIR/nvm.sh"
          pm2 startOrReload /opt/myapp/ecosystem.config.js
          pm2 save
          pm2 status || true
